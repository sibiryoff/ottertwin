name: OtterTwin

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

options:
  bundleIdPrefix: com.mas
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  OtterTwin:
    type: application
    platform: macOS
    sources:
      - path: OtterTwin
        excludes:
          - "Resources/OtterTwin.entitlements"
          - "Resources/Info.plist"
    resources:
      - OtterTwin/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mas.ottertwin
        GENERATE_INFOPLIST_FILE: YES
        # Partial Info.plist merged into the generated one: only the build
        # SHA/date keys (see BuildInfo.swift). Not managed by xcodegen `info:`.
        INFOPLIST_FILE: OtterTwin/Resources/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Overridden on the xcodebuild command line by scripts/install-local.sh
        # and the CI release-build job; plain Xcode builds show "unknown".
        OTTERTWIN_GIT_SHA: ""
        OTTERTWIN_BUILD_DATE: ""
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: OtterTwin
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: OtterTwin/Resources/OtterTwin.entitlements
    dependencies:
      - framework: NetFS.framework
        embed: false

  OtterTwinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OtterTwinTests
    dependencies:
      - target: OtterTwin
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mas.ottertwinTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OtterTwin.app/Contents/MacOS/OtterTwin"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OtterTwinUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - OtterTwinUITests
    dependencies:
      - target: OtterTwin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mas.ottertwinUITests
        GENERATE_INFOPLIST_FILE: YES

# Shared schemes are declared explicitly so CI and local runs use the same,
# reproducible build/test configuration (no reliance on Xcode auto-created schemes).
schemes:
  OtterTwin:
    build:
      targets:
        OtterTwin: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OtterTwinTests
    archive:
      config: Release

  OtterTwinTests:
    build:
      targets:
        OtterTwinTests: [test]
    test:
      config: Debug
      targets:
        - OtterTwinTests

  OtterTwinUITests:
    build:
      targets:
        OtterTwinUITests: [test]
    test:
      config: Debug
      targets:
        - OtterTwinUITests
